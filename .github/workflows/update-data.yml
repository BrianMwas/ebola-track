# Daily data refresh: rebuild public/data/ from the latest INRB release and
# commit it to main when the data has changed. Cloudflare Workers Builds
# deploys every push to main, so the site follows within minutes.
#
# The hand-maintained data/country-totals.json is not touched here; edit it
# by hand and run `bun run build-snapshot` locally.
name: Update data

on:
  schedule:
    # 05:17 UTC every day. INRB's daily builds have landed by then (their
    # release tags carry the previous evening's build time).
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # Fails, and commits nothing, on any schema error or unmatched zone name.
      - name: Build snapshot from the latest INRB release
        run: bun run build-snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the new snapshot
        run: |
          bun run typecheck
          bun run test

      # Every build rewrites the timestamps in latest.json and provenance.json,
      # so only commit when something else changed (new cases, zones, totals).
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- public/data data ':!public/data/latest.json' ':!public/data/provenance.json'; then
            echo "No new data; nothing to commit."
            exit 0
          fi
          tag=$(node -p "require('./public/data/latest.json').inrb_release_tag")
          asof=$(node -p "require('./public/data/latest.json').data_as_of")
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data data/unmatched-names.json
          git commit -m "data: INRB release ${tag} (data as of ${asof})"
          git push
